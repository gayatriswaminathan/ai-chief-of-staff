# AI Chief of Staff — platform foundation (phase 1)
# Local spine: MongoDB (replica set) -> Kafka Connect CDC -> Kafka, plus Neo4j, OPA.
# ZITADEL (identity) runs under the "auth" profile: docker compose --profile auth up
#
# Start:   docker compose up -d
# Verify:  ./scripts/verify.sh

services:
  mongo:
    image: mongo:7
    container_name: cos-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --quiet --eval
      "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"

  kafka:
    image: apache/kafka:3.7.0
    container_name: cos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    container_name: cos-connect
    depends_on:
      kafka:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: cos-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt mongodb/kafka-connect-mongodb:1.11.2
        /etc/confluent/docker/run
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5.20
    container_name: cos-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/coslocal1
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  opa:
    image: openpolicyagent/opa:0.64.1
    container_name: cos-opa
    command: ["run", "--server", "--addr", ":8181", "--watch", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./opa:/policies:ro

  # ---- phase 2: application services ----
  commitment-service:
    build: ../services/commitment-service
    container_name: cos-commitment-service
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      OPA_URL: http://opa:8181
    ports:
      - "8001:8000"

  decision-service:
    build: ../services/decision-service
    container_name: cos-decision-service
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      OPA_URL: http://opa:8181
    ports:
      - "8005:8000"

  action-service:
    build: ../services/action-service
    container_name: cos-action-service
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      OPA_URL: http://opa:8181
      COMMITMENT_SERVICE_URL: http://commitment-service:8000
    ports:
      - "8004:8000"

  meeting-service:
    build: ../services/meeting-service
    container_name: cos-meeting-service
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      OPA_URL: http://opa:8181
      COMMITMENT_SERVICE_URL: http://commitment-service:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8003:8000"

  calendar-connector:
    build: ../services/calendar-connector
    container_name: cos-calendar-connector
    depends_on:
      - meeting-service
    environment:
      CALENDAR_ICS_URL: ${CALENDAR_ICS_URL:-}
      MEETING_SERVICE_URL: http://meeting-service:8000
      ACTOR: leader@example.com
      PRINCIPAL: principal-001
      POLL_SECONDS: "300"
    restart: unless-stopped

  cos-indexer:
    build: ../services/cos-indexer
    container_name: cos-indexer
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: coslocal1
    restart: unless-stopped

  cos-chat:
    build: ../services/cos-chat
    container_name: cos-chat
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: coslocal1
      OPA_URL: http://opa:8181
      ACTION_SERVICE_URL: http://action-service:8000
      DECISION_SERVICE_URL: http://decision-service:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8002:8000"

  # ---- identity (phase 1b) — docker compose --profile auth up -d ----
  zitadel-db:
    profiles: ["auth"]
    image: postgres:16
    container_name: cos-zitadel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data

  zitadel:
    profiles: ["auth"]
    image: ghcr.io/zitadel/zitadel:v2.55.0
    container_name: cos-zitadel
    depends_on:
      - zitadel-db
    command: >
      start-from-init --masterkey "MasterkeyNeedsToHave32Characters"
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: CosAdmin1!
    ports:
      - "8080:8080"

volumes:
  mongo-data:
  neo4j-data:
  zitadel-db-data:
